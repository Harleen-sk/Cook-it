version: '3.8'

services:
  # Backend FastAPI
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    networks:
      - app-network

  # Frontend Expo (Mode Web pour le développement facile sous Docker)
  frontend:
    build: ./frontend
    ports:
      - "19006:19006"
      - "8081:8081"
    volumes:
      - ./frontend:/app
      - /app/node_modules # Important : empêche Docker d'écraser les modules installés dans l'image
    environment:
      - REACT_NATIVE_PACKAGER_HOSTNAME=10.110.228.127
    stdin_open: true # Permet l'interaction avec le terminal Expo
    tty: true
    networks:
      - app-network

networks:
  app-network:
    driver: bridge